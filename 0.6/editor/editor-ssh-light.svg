<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 170" width="100%" role="img" aria-label="The browser on the local computer talks to localhost:8080, which an SSH tunnel forwards to the nf-meta editor backend on the cluster; the backend reads and saves metapipeline.yaml there and fetches from nf-core">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#3f4757"/>
    </marker>
    <style>
      .t { font: 600 15px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1f2430; }
      .s { font: 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #566070; }
      .m { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #3f4757; }
      .c { font: italic 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #6b7486; }
      .z { font: 600 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #6b7486; letter-spacing: 0.08em; }
      .l { stroke: #3f4757; stroke-width: 1.5; fill: none; }
      .r { fill: #eceff3; stroke: #aab2bf; stroke-width: 1.5; stroke-dasharray: 5 5; }
    </style>
  </defs>
  <rect x="0" y="0" width="800" height="170" rx="12" fill="#f6f7f9"/>

  <!-- the two machines -->
  <rect class="r" x="8" y="8" width="196" height="154" rx="10"/>
  <text class="z" x="20" y="28">LOCAL COMPUTER</text>
  <rect class="r" x="380" y="8" width="412" height="154" rx="10"/>
  <text class="z" x="392" y="28">CLUSTER</text>

  <!-- browser -->
  <rect x="20" y="45" width="172" height="70" rx="10" fill="#e8f1fc" stroke="#2b7bd6" stroke-width="2"/>
  <text class="t" x="106" y="76" text-anchor="middle">Browser</text>
  <text class="s" x="106" y="96" text-anchor="middle">editor page</text>
  <text class="c" x="106" y="138" text-anchor="middle">opened via the printed link</text>

  <!-- the SSH tunnel, between the machines -->
  <rect x="200" y="68" width="184" height="24" rx="12" fill="#dfe4ec" stroke="#97a0ae" stroke-width="1.5"/>
  <line class="l" x1="196" y1="80" x2="388" y2="80" marker-start="url(#a)" marker-end="url(#a)"/>
  <text class="m" x="292" y="58" text-anchor="middle">ssh -L 8080:localhost:8080</text>
  <text class="m" x="292" y="110" text-anchor="middle">token on every request</text>

  <!-- backend -->
  <rect x="392" y="45" width="190" height="70" rx="10" fill="#e5f4ea" stroke="#1b9a54" stroke-width="2"/>
  <text class="t" x="487" y="76" text-anchor="middle">nf-meta editor</text>
  <text class="s" x="487" y="96" text-anchor="middle">session · checks · history</text>
  <text class="c" x="487" y="138" text-anchor="middle">started with --port 8080</text>

  <!-- backend -> files, nf-core -->
  <path class="l" d="M586 65 C 607 65, 607 45, 626 45" marker-end="url(#a)"/>
  <path class="l" d="M586 95 C 607 95, 607 125, 626 125" marker-end="url(#a)"/>
  <rect x="630" y="20" width="150" height="50" rx="9" fill="#f4eafa" stroke="#9a48c2" stroke-width="2"/>
  <text class="t" x="705" y="50" text-anchor="middle" style="font-size:13px">metapipeline.yaml</text>
  <rect x="630" y="100" width="150" height="50" rx="9" fill="#eceef1" stroke="#6b7486" stroke-width="2"/>
  <text class="t" x="705" y="130" text-anchor="middle" style="font-size:13px">nf-core</text>
</svg>
