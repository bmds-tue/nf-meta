<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 170" width="100%" role="img" aria-label="The browser talks to the nf-meta editor backend over HTTP on 127.0.0.1 with a session token; the backend reads and saves the config and fetches nf-core schemas">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#c8ced8"/>
    </marker>
    <style>
      .t { font: 600 15px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #e8eaee; }
      .s { font: 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #a3abb8; }
      .m { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #c8ced8; }
      .c { font: italic 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #8a93a3; }
      .l { stroke: #c8ced8; stroke-width: 1.5; fill: none; }
    </style>
  </defs>
  <rect x="0" y="0" width="800" height="170" rx="12" fill="#1c2028"/>

  <!-- browser -->
  <rect x="20" y="45" width="180" height="70" rx="10" fill="#222936" stroke="#61afef" stroke-width="2"/>
  <text class="t" x="110" y="76" text-anchor="middle">Browser</text>
  <text class="s" x="110" y="96" text-anchor="middle">editor page</text>
  <text class="c" x="110" y="138" text-anchor="middle">opened via the printed link</text>

  <!-- browser <-> backend -->
  <line class="l" x1="204" y1="80" x2="376" y2="80" marker-start="url(#a)" marker-end="url(#a)"/>
  <text class="m" x="290" y="70" text-anchor="middle">HTTP · 127.0.0.1:&lt;port&gt;</text>
  <text class="m" x="290" y="98" text-anchor="middle">token on every request</text>

  <!-- backend -->
  <rect x="380" y="45" width="200" height="70" rx="10" fill="#1f2d27" stroke="#2fbf71" stroke-width="2"/>
  <text class="t" x="480" y="76" text-anchor="middle">nf-meta editor</text>
  <text class="s" x="480" y="96" text-anchor="middle">session · checks · history</text>

  <!-- backend -> files, nf-core -->
  <path class="l" d="M584 65 C 605 65, 605 45, 626 45" marker-end="url(#a)"/>
  <path class="l" d="M584 95 C 605 95, 605 125, 626 125" marker-end="url(#a)"/>
  <rect x="630" y="20" width="150" height="50" rx="9" fill="#2a2333" stroke="#c678dd" stroke-width="2"/>
  <text class="t" x="705" y="41" text-anchor="middle" style="font-size:13px">metapipeline.yaml</text>
  <text class="s" x="705" y="58" text-anchor="middle">reads · saves · folders</text>
  <rect x="630" y="100" width="150" height="50" rx="9" fill="#262a31" stroke="#8a93a3" stroke-width="2"/>
  <text class="t" x="705" y="121" text-anchor="middle" style="font-size:13px">nf-core</text>
  <text class="s" x="705" y="138" text-anchor="middle">catalog · schemas</text>
</svg>
